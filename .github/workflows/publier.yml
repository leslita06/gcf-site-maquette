name: publier
on:
  push:
    paths: ['paquet.txt']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Recuperer le paquet du site
        run: |
          URL=$(sed -n 1p paquet.txt)
          SHA=$(sed -n 2p paquet.txt)
          curl -sSfL -o /tmp/site.tgz "$URL"
          echo "$SHA  /tmp/site.tgz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name paquet.txt -exec rm -rf {} +
          tar xzf /tmp/site.tgz -C .
          touch .nojekyll
      - name: Enregistrer dans le depot
        run: |
          git config user.name "leslita06"
          git config user.email "280789085+leslita06@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Site V2 : mise a jour du paquet"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
